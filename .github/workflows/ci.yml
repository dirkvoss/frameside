name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Compose-Dateien pruefen
        run: |
          sed -e 's|^RAHMEN_IMMICH_URL=$|RAHMEN_IMMICH_URL=http://immich:2283/api|' -e 's|^RAHMEN_IMMICH_KEY=$|RAHMEN_IMMICH_KEY=x|' .env.example > .env
          docker compose config -q
          COMPOSE_FILE=docker-compose.yml:docker-compose.immich-network.yml docker compose config -q
          COMPOSE_FILE=docker-compose.yml:docker-compose.build.yml docker compose config -q
          rm .env
          (cd examples/immich-stack && DB_PASSWORD=x docker compose config -q)
          bash -n install.sh
          bash -n examples/raspberry-pi/setup-kiosk.sh

  integration:
    # Echtes Immich (ohne Machine Learning) mit erfundenen Fotos/Personen/Konten: Frameside verbindet sich, postdeploy.py + Zusatzpruefungen.
    # "release" ist die jeweils neueste Immich-Version (Vorwarnung bei Aenderungen) und blockiert die Freigabe nicht.
    needs: test
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}     # beim Versions-Tag nicht wiederholen: derselbe Commit war auf main schon gruen
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {immich: v3.2.4, experimental: false}
          - {immich: release, experimental: true}
    steps:
      - uses: actions/checkout@v4
      - name: Docker-Hub-Spiegel (gegen die Download-Begrenzung gemeinsam genutzter Rechner)
        run: |
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: showcase:int
          cache-from: type=gha
      - name: Werkzeuge fuer die Testdaten
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libimage-exiftool-perl ffmpeg python3-pil >/dev/null
      - name: Integrationstest gegen Immich ${{ matrix.immich }}
        run: bash tests/integration_immich.sh ${{ matrix.immich }} showcase:int

  image:
    # Das Image wird bei jedem Lauf gebaut (faengt Fehler im Dockerfile) und nur bei einem Versions-Tag (v1.2.3) veroeffentlicht.
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Version bestimmen
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - name: Image bauen und Rauchtest
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          build-args: SHOWCASE_VERSION=${{ steps.v.outputs.version }}
          tags: showcase:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: bash tests/smoke_container.sh showcase:ci

  publish:
    # Nur bei Versions-Tag: Multi-Arch-Image (amd64+arm64) veroeffentlichen, nachdem Tests (und Integration auf main) gruen waren.
    needs: [test, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write            # fuer die Signatur des Images (cosign, ohne Schluessel)
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Version bestimmen
        id: v
        run: |
          V="${GITHUB_REF_NAME#v}"
          { echo "version=$V"; echo "minor=${V%.*}"; echo "major=${V%%.*}"; } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Veroeffentlichen (nur bei Versions-Tag)
        id: bauen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max                          # Herkunftsnachweis und Software-Stueckliste (SBOM) am Image
          sbom: true
          build-args: SHOWCASE_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.minor }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.major }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
      - name: Image signieren (cosign, ohne eigenen Schluessel)
        continue-on-error: true
        uses: sigstore/cosign-installer@v3
      - name: Signatur anbringen
        continue-on-error: true
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.bauen.outputs.digest }}"
      - name: Unter dem alten Namen weiter anbieten (Uebergang, bestehende Installationen und Server)
        continue-on-error: true
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/immich-showcase:${{ steps.v.outputs.version }} -t ghcr.io/${{ github.repository_owner }}/immich-showcase:latest ${{ env.IMAGE }}:${{ steps.v.outputs.version }}

  release:
    # Legt das GitHub-Release an (Notizen aus .github/release-notes/<Version>.md, sonst aus dem CHANGELOG). Gibt es das Release schon, passiert nichts.
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "Release $GITHUB_REF_NAME gibt es schon."; exit 0; fi
          if [ -f ".github/release-notes/$V.md" ]; then cp ".github/release-notes/$V.md" notes.md
          else awk -v v="$V" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md; fi
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          TITEL="$V"
          if head -n1 notes.md | grep -q '^# '; then TITEL="$V – $(head -n1 notes.md | sed 's/^# //')"; sed -i 1d notes.md; fi
          gh release create "$GITHUB_REF_NAME" --title "$TITEL" --notes-file notes.md --latest
